<div class="home-page">
  <section class="hero">
    <div class="container">
      <h1>Social Network Analysis Platform</h1>
      <p class="subtitle">Analyze network structures, visualize them, and discover their meaning.</p>
      <p class="subtitle">To navigate to our User Interface page with a single click: <a routerLink="user/dashboard" class="accent">Get Started</a></p>
      <div class="cta-buttons">
        <a [routerLink]="ctaLink" class="btn btn-primary">{{ ctaText }}</a>
        <a routerLink="/features" class="btn btn-outline">Features Overview</a>
      </div>
    </div>
  </section>

  <section class="features-preview">
    <div class="container">
      <h2>Why SNA Platform?</h2>
      <div class="features-grid">
        <div class="feature-card" *ngFor="let feature of features">
          <div class="icon">{{ feature.icon }}</div>
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.desc }}</p>
        </div>
      </div>
    </div>
  </section>
</div>
