<header class="header">
  <div class="header-content">
    <div class="logo-section">
      <div class="logo">
        <h2>
          <i class="fa-solid fa-circle-nodes me-2"></i>
          SNA Plateform</h2>
      </div>
    </div>
    <div class="profile-section">
      <div class="profile-dropdown" (click)="toggleDropdown()">
        <i class="fa-solid fa-user-circle"></i>
        <span class="profile-name">{{ isLoggedIn && currentUser ? currentUser : 'Menü' }}</span>
        <i class="fa-solid fa-caret-down ms-1"></i>
      </div>
      @if (isDropdownOpen) {
        <div class="dropdown-menu">
          @if (isLoggedIn && currentUser) {
            <div class="dropdown-header">
              <p class="user-name">{{ currentUser.name }}</p>
              <p class="user-email">{{ currentUser.email }}</p>
            </div>
            <a routerLink="/" class="dropdown-item">🏠 Ana Sayfaya Dön</a>
            <a routerLink="/User-Interface/settings" class="dropdown-item">⚙️ Ayarlar</a>
            <div class="dropdown-divider"></div>
            <a (click)="logout()" class="dropdown-item logout-item">🚪 Çıkış Yap</a>
          } @else {
            <a routerLink="/login" class="dropdown-item">🔑 Giriş Yap</a>
            <a routerLink="/register" class="dropdown-item">📝 Kaydol</a>
          }
        </div>
      }
    </div>
  </div>
</header>
