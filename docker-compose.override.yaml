
services:
  social-networkdb:
    container_name: social-network-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd12!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  seq:
    container_name: seq
    environment: 
     - ACCEPT_EULA=Y
    restart: always
    ports:
     - '5341:5341'
     - '9091:80'
    volumes:
     - seq-data:/data

  api:
    container_name: social-network-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DatabaseConnection: >
        Server=social-networkdb,1433;
        Database=SocialNetworkDb;
        User Id=sa;
        Password=P@ssw0rd12!;
        TrustServerCertificate=True;
        MultipleActiveResultSets=True;

      Serilog__Using__0: Serilog.Sinks.Console
      Serilog__Using__1: Serilog.Sinks.Seq
      Serilog__Using__2: Serilog.Sinks.File

      Serilog__MinimumLevel__Default: Information
      Serilog__MinimumLevel__Override__Microsoft: Information
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore: Information
      Serilog__MinimumLevel__Override__Microsoft.Hosting.Lifetime: Information
      Serilog__MinimumLevel__Override__System: Warning

      Serilog__WriteTo__0__Name: Console
      Serilog__WriteTo__1__Name: File
      Serilog__WriteTo__1__Args__path: Logs/SocialNetworkAnalysis-API-.log
      Serilog__WriteTo__1__Args__rollingInterval: Day
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
    depends_on:
     - social-networkdb
     - seq
    ports:
     - "5000:8080"
    volumes:
     - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
     - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
     - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
     - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  
  frontend-angular:
    container_name: social-network-client
    depends_on:
     - api
    ports:
     - "4200:80"
  
volumes:
  sqlserver-data:
  seq-data:


